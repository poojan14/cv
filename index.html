<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Vision Special Session</title>
<meta name="description" content="Interactive 90-minute session: computer vision basics, history, image enhancement and Otsu segmentation in MATLAB, OpenCV, YOLO object detection and SAM segmentation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F7FA; --surface-2:#EBF1F8; --line:#DCE3EB;
  --ink:#1A2433; --ink-2:#4A5568; --muted:#718096;
  --blue:#1F4E8C; --blue-ink:#173D6E; --blue-soft:#E7EFF9;
  --green:#2E7D5B; --green-soft:#E6F3EC; --red:#B4472F; --red-soft:#FBEAE5;
  --yellow-soft:#FFF4CC; --code-bg:#F5F7FA; --code-com:#2E7D5B; --code-str:#9A4A12;
  /* aliases used by shared drawing code */
  --paper:var(--bg); --teal:var(--blue);
  --serif:"Source Serif 4", Cambria, Georgia, serif;
  --sans:"Source Sans 3", Calibri, "Segoe UI", Arial, sans-serif;
  --mono:"Source Code Pro", Consolas, "Courier New", monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A21; --surface:#1C232C; --surface-2:#22303F; --line:#2F3B49;
    --ink:#E6EBF1; --ink-2:#B8C2CF; --muted:#8C99A9;
    --blue:#7FAEE8; --blue-ink:#A8C8F0; --blue-soft:#1F3049;
    --green:#6CC59B; --green-soft:#1C3328; --red:#EC8A72; --red-soft:#3A2420;
    --yellow-soft:#3B3418; --code-bg:#1C232C; --code-com:#7CCB9F; --code-str:#E4A06A;
  }
}
:root[data-theme="dark"]{
  --bg:#151A21; --surface:#1C232C; --surface-2:#22303F; --line:#2F3B49;
  --ink:#E6EBF1; --ink-2:#B8C2CF; --muted:#8C99A9;
  --blue:#7FAEE8; --blue-ink:#A8C8F0; --blue-soft:#1F3049;
  --green:#6CC59B; --green-soft:#1C3328; --red:#EC8A72; --red-soft:#3A2420;
  --yellow-soft:#3B3418; --code-bg:#1C232C; --code-com:#7CCB9F; --code-str:#E4A06A;
}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px)); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.6}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
img,canvas{max-width:100%}
[hidden]{display:none !important}
a{color:var(--blue)}
code{font-family:var(--mono); font-size:.9em; background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:0 5px}

/* top bar */
.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:10px 18px; padding-top:calc(10px + env(safe-area-inset-top,0px)); margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top .menu{border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:5px 12px; cursor:pointer}
.top .ttl{font-family:var(--serif); font-weight:700; font-size:18px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top .ttl span{color:var(--muted); font-family:var(--sans); font-weight:400; font-size:15px; margin-left:8px}
.top .theme{border:1px solid var(--line); background:var(--bg); border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:18px; line-height:1}
.prog{height:3px; background:var(--line); position:sticky; top:calc(57px + env(safe-area-inset-top,0px)); z-index:19}
.prog i{display:block; height:100%; background:var(--blue); width:0; transition:width .3s}

/* layout */
.layout{display:grid; grid-template-columns:280px minmax(0,1fr); max-width:1320px; margin:0 auto}
.toc{position:sticky; top:calc(60px + env(safe-area-inset-top,0px)); height:calc(100vh - 60px - env(safe-area-inset-top,0px)); overflow:auto; padding:22px 14px 40px 22px; border-right:1px solid var(--line)}
.toc h4{font-size:13px; color:var(--muted); font-weight:600; margin:18px 0 6px 8px}
.toc h4:first-child{margin-top:0}
.toc ol{list-style:none; margin:0; padding:0}
.toc a{display:flex; gap:8px; align-items:baseline; padding:5px 8px; border-radius:6px; text-decoration:none; color:var(--ink-2); font-size:15px; line-height:1.35}
.toc a:hover{background:var(--surface)}
.toc a[aria-current="page"]{background:var(--blue-soft); color:var(--blue-ink); font-weight:600}
.toc .tick{width:14px; flex:none; color:var(--green); font-size:13px}
.scrim{display:none}

main{padding:36px clamp(18px,5vw,64px) 40px; min-width:0}
.sec{max-width:880px}
.kicker{color:var(--blue); font-weight:600; font-size:15px; margin:0 0 4px}
h1{font-family:var(--serif); font-size:clamp(30px,4vw,42px); line-height:1.15; margin:0 0 14px}
h2{font-family:var(--serif); font-size:clamp(26px,3.2vw,34px); line-height:1.2; margin:0 0 12px}
h3{font-family:var(--serif); font-size:21px; margin:30px 0 8px}
p{margin:0 0 14px}
.lead{font-size:19px; color:var(--ink-2); max-width:64ch}
.prose{max-width:68ch}
.prose ul,.prose ol{padding-left:22px; margin:0 0 14px}
.prose li{margin-bottom:6px}
.muted{color:var(--muted)}

.btn{border:1px solid var(--blue); background:var(--blue); color:#fff; border-radius:8px; padding:8px 16px; cursor:pointer; font-weight:600}
:root[data-theme="dark"] .btn{color:#10161D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10161D}}
.btn.ghost{background:transparent; color:var(--blue); border-color:var(--line)}
.btn.sm{padding:5px 12px; font-size:15px}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}

.plan{list-style:none; padding:0; margin:0; counter-reset:p; border-top:1px solid var(--line)}
.plan li{border-bottom:1px solid var(--line)}
.plan a{display:grid; grid-template-columns:44px 1fr; gap:4px 12px; padding:12px 4px; text-decoration:none; color:var(--ink)}
.plan a:hover{background:var(--surface)}
.plan .n{font-family:var(--serif); font-weight:700; font-size:22px; color:var(--blue); grid-row:span 2}
.plan b{font-weight:600}
.plan span{color:var(--ink-2); font-size:15px}

.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin:14px 0}
.box{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--bg)}
.box h4{margin:0 0 6px; font-size:17px}
.box p{margin:0; color:var(--ink-2); font-size:16px}
.callout{border-left:4px solid var(--blue); background:var(--blue-soft); padding:12px 16px; border-radius:0 8px 8px 0; margin:18px 0; max-width:72ch}
.callout.green{border-color:var(--green); background:var(--green-soft)}
.formula{font-family:var(--serif); font-size:20px; padding:8px 16px; background:var(--surface); border-radius:8px; display:inline-block; margin:4px 8px 12px 0}
.stat{display:flex; gap:24px; flex-wrap:wrap; margin:16px 0}
.stat div{min-width:120px}
.stat b{display:block; font-family:var(--serif); font-size:34px; color:var(--blue); line-height:1}
.stat span{font-size:15px; color:var(--ink-2)}

/* try-it widgets */
.try{border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px; margin:22px 0; background:var(--surface)}
.try-h{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.badge{font-size:13px; font-weight:700; background:var(--blue); color:#fff; border-radius:4px; padding:1px 8px}
:root[data-theme="dark"] .badge{color:#10161D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#10161D}}
.try-h b{font-size:18px}
.try-h .sub{color:var(--muted); font-size:15px}
.controls{display:flex; flex-wrap:wrap; gap:12px 22px; align-items:center; margin:8px 0 14px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--bg)}
.seg button{border:0; background:none; padding:6px 12px; cursor:pointer; font-size:15px; border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10161D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10161D}}
.slider{display:flex; align-items:center; gap:10px; font-size:15px}
.slider input{width:170px; accent-color:var(--blue)}
.slider output{font-family:var(--mono); min-width:4ch; font-weight:600}
.views{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,300px)); gap:14px}
.view figure{margin:0}
.view canvas{width:100%; height:auto; aspect-ratio:1/1; border-radius:6px; background:#000; display:block; border:1px solid var(--line)}
.view figcaption{font-size:14px; color:var(--ink-2); margin-top:5px; display:flex; justify-content:space-between; gap:8px}
.view figcaption span:last-child{font-family:var(--mono); color:var(--muted)}
.hist canvas{aspect-ratio:2/1; background:var(--bg)}
.note{font-size:15px; color:var(--ink-2); margin:12px 0 0; max-width:72ch}

.masks{display:flex; flex-wrap:wrap; gap:18px; margin:8px 0}
.mtab{border-collapse:collapse; font-family:var(--mono); font-size:15px}
.mtab td{border:1px solid var(--line); width:40px; height:34px; text-align:center; background:var(--bg)}
.mtab td.c{background:var(--blue-soft); font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px}
.chip{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:5px 14px; cursor:pointer; font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--blue); background:var(--blue-soft); color:var(--blue-ink); font-weight:600}

.pix-wrap{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:20px; align-items:start}
.pix-wrap canvas{width:100%; aspect-ratio:1/1; cursor:crosshair; border-radius:6px; border:1px solid var(--line); touch-action:none}
.ptab{border-collapse:collapse; font-family:var(--mono); font-size:13px}
.ptab td{width:40px; height:30px; text-align:center; border:1px solid rgba(127,127,127,.25)}
.ptab td.ctr{outline:3px solid var(--blue); outline-offset:-3px; font-weight:700}

.grid-pair{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start}
.bgrid{display:grid; gap:2px; background:var(--line); border:2px solid var(--line); width:max-content}
.bgrid button{width:22px; height:22px; border:0; padding:0; background:#1A2433; cursor:pointer}
.bgrid button.on{background:#FFFFFF}
.bgrid button.lost{background:var(--red)}
.bgrid button.gain{background:#8FD3A8}
.bgrid.out button{cursor:default}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--ink-2); margin-top:8px}
.legend i{display:inline-block; width:12px; height:12px; border:1px solid var(--line); margin-right:5px; vertical-align:-1px}

/* commands */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; margin:12px 0}
table.t{width:100%; border-collapse:collapse; font-size:16px}
table.t th{text-align:left; font-weight:600; padding:9px 14px; background:var(--surface); border-bottom:1px solid var(--line); font-size:15px}
table.t td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.mono{font-family:var(--mono); font-size:15px; color:var(--blue-ink); min-width:150px; overflow-wrap:anywhere}
table.t td:nth-child(2){min-width:200px}
table.t td.ex code{white-space:pre-wrap; overflow-wrap:anywhere; display:inline-block; max-width:420px}
table.t input{width:100%; min-width:80px; border:1px solid var(--line); border-radius:6px; padding:4px 8px; background:var(--bg)}

/* steps */
.use{margin:0 0 6px; font-size:15px; color:var(--ink-2)}
.see{margin:0 0 8px; font-size:15px; color:var(--ink-2); max-width:68ch}
.peek{margin:6px 0 10px}
.peek summary{cursor:pointer; color:var(--blue); font-size:15px; font-weight:600}
.peek .code{margin-top:8px}
.tickbox{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; background:var(--bg); font-weight:600; font-size:15px}
.tickbox input{width:18px; height:18px; accent-color:var(--green)}
.step.ok .tickbox{border-color:var(--green); background:var(--green-soft)}
.ide{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:14px 0 22px}
.ide div{border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--surface)}
.ide b:first-child{display:block; margin-bottom:4px}
.counter{display:flex; align-items:center; gap:12px; margin:6px 0 18px; font-weight:600; color:var(--ink-2)}
.counter .bar{width:220px; max-width:50%; height:8px; border-radius:4px; background:var(--line); overflow:hidden}
.counter .bar i{display:block; height:100%; background:var(--green); width:0; transition:width .3s}
.steps{list-style:none; margin:0; padding:0}
.step{display:grid; grid-template-columns:40px minmax(0,1fr); gap:0 16px; padding-bottom:24px; position:relative}
.step::before{content:""; position:absolute; left:19px; top:40px; bottom:4px; width:2px; background:var(--line)}
.step:last-child::before{display:none}
.step .num{width:40px; height:40px; border-radius:50%; border:2px solid var(--line); background:var(--bg); display:grid; place-items:center; font-weight:700; color:var(--ink-2); position:relative; z-index:1}
.step.ok .num{background:var(--green); border-color:var(--green); color:#fff}
.step.locked{opacity:.45}
.step h4{margin:7px 0 4px; font-size:18px}
.step .ins{margin:0 0 10px; color:var(--ink-2); max-width:68ch}
.code{background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:11px 14px; font-family:var(--mono); font-size:15px; white-space:pre; overflow-x:auto; line-height:1.75; color:var(--ink)}
.code .com{color:var(--code-com); font-style:italic}
.code input{font-family:var(--mono); font-size:15px; background:var(--yellow-soft); border:0; border-bottom:2px solid #D4A72C; border-radius:3px 3px 0 0; padding:0 4px; color:var(--ink)}
.code input.right{background:var(--green-soft); border-bottom-color:var(--green)}
.code input.wrong{background:var(--red-soft); border-bottom-color:var(--red)}
.fb{font-size:15px}
.fb.good{color:var(--green)} .fb.bad{color:var(--red)}
.why{font-size:15px; color:var(--ink-2); border-left:3px solid var(--green); padding:2px 12px; margin-top:10px; max-width:68ch}
details.full{margin:18px 0}
details.full summary{cursor:pointer; font-weight:600; color:var(--blue)}
details.full .code{margin-top:10px; line-height:1.6}

/* quiz */
.q{margin:0 0 20px}
.q > p{margin:0 0 8px; font-weight:600}
.opts{display:flex; flex-direction:column; gap:6px; max-width:620px}
.opt{border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; background:var(--bg); text-align:left}
.opt:hover{border-color:var(--blue)}
.opt.right{border-color:var(--green); background:var(--green-soft)}
.opt.wrong{border-color:var(--red); background:var(--red-soft)}
.qexp{font-size:15px; color:var(--ink-2); margin-top:6px}

/* reveal cards */
.reveal{border:1px solid var(--line); border-radius:10px; margin:10px 0; background:var(--bg)}
.reveal summary{cursor:pointer; padding:12px 16px; font-weight:600; list-style:none; display:flex; justify-content:space-between; gap:10px}
.reveal summary::-webkit-details-marker{display:none}
.reveal summary::after{content:"+"; color:var(--blue); font-size:20px; line-height:1}
.reveal[open] summary::after{content:"\2212"}
.reveal .body{padding:0 16px 14px; color:var(--ink-2)}
.reveal .body p{margin:0 0 6px}

.result-img{width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff; margin:8px 0}
.console{font-family:var(--mono); font-size:14.5px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 14px; white-space:pre; overflow-x:auto; margin:10px 0}

.search{width:100%; max-width:480px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; background:var(--bg); margin:6px 0 12px}

.pager{display:flex; justify-content:space-between; align-items:center; gap:12px; max-width:880px; margin-top:44px; padding-top:18px; border-top:1px solid var(--line)}
.pager .mid{color:var(--muted); font-size:14px; text-align:center}
.hint-keys{color:var(--muted); font-size:14px}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:15px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50}
.toast.show{opacity:1}

/* account + tasks */
.acct{display:flex; align-items:center; gap:8px}
.acct .who{font-size:14px; color:var(--ink-2); text-align:right; line-height:1.2; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.acct .who b{color:var(--ink); display:block; overflow:hidden; text-overflow:ellipsis}
.acct .btn{padding:6px 12px; font-size:15px}
.gbtn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:600; font-size:15px}
.gbtn svg{width:18px; height:18px}
.authcard{border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--surface); margin:16px 0; max-width:640px}
.authcard h4{margin:0 0 6px; font-size:17px}
.authcard p{margin:0 0 10px; color:var(--ink-2)}
.form{display:grid; gap:12px; max-width:460px}
.form label{display:grid; gap:4px; font-weight:600; font-size:15px}
.form input[type=text]{border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--bg); font-weight:400}
.form small{font-weight:400; color:var(--muted)}
.err{color:var(--red); font-size:15px}
.ok-msg{color:var(--green); font-size:15px; font-weight:600}
.dl-row{display:flex; flex-wrap:wrap; gap:14px; margin:10px 0 18px}
.dl{display:flex; gap:12px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:10px 14px 10px 10px; background:var(--bg); text-decoration:none; color:var(--ink)}
.dl img{width:72px; height:72px; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:#000}
.dl b{display:block}
.dl span{font-size:14px; color:var(--blue); font-weight:600}
.tq{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:0 0 12px; background:var(--bg)}
.tq .ql{font-weight:600; margin:0 0 8px; display:block}
.tq .qn{color:var(--blue); margin-right:6px}
.tq input[type=text], .tq textarea{width:100%; max-width:320px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--bg)}
.tq textarea{max-width:100%; min-height:72px; resize:vertical}
.tq .ch{display:flex; flex-direction:column; gap:6px}
.tq .ch label{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; background:var(--bg)}
.tq .ch label:has(input:checked){border-color:var(--blue); background:var(--blue-soft)}
.tq .ch input{margin-top:5px; accent-color:var(--blue)}
.tq .pts{float:right; font-size:13px; color:var(--muted); font-weight:400}
.locked-ans{font-family:var(--mono); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:4px 10px; display:inline-block}
.status{display:inline-flex; gap:8px; align-items:center; font-weight:600; border-radius:999px; padding:4px 12px; font-size:14px}
.status.sub{background:var(--green-soft); color:var(--green)}
.status.not{background:var(--surface); color:var(--ink-2); border:1px solid var(--line)}
.mk{width:100%; border-collapse:collapse; margin:10px 0}
.mk th,.mk td{border-bottom:1px solid var(--line); padding:9px 12px; text-align:left}
.mk th{background:var(--surface); font-size:15px}
.mk td.n{font-family:var(--mono); font-weight:600}

.scorebar{display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 16px; margin:0 0 12px}
.scorebar b{font-family:var(--serif); font-size:26px; color:var(--blue)}
.tq.good{border-color:var(--green); background:var(--green-soft)}
.tq.retry{border-color:#D4A72C}
.tq.bad{border-color:var(--red); background:var(--red-soft)}
.qrow{margin-top:10px; gap:12px}
.res{font-weight:700} .res.ok{color:var(--green)} .res.bad{color:var(--red)}


@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{position:fixed; left:0; top:0; bottom:0; width:300px; max-width:85vw; height:100%; background:var(--bg); z-index:40; transform:translateX(-105%); transition:transform .25s; padding-top:calc(22px + env(safe-area-inset-top,0px)); border-right:1px solid var(--line)}
  body.toc-open .toc{transform:none}
  body.toc-open .scrim{display:block; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:30}
  .pix-wrap{grid-template-columns:1fr}
  .top .ttl span{display:none}
}
@media (min-width:981px){ .top .menu{display:none} }
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

/* ---------- additions for the CV special session ---------- */
:root{ --amber:#9A6A00; --amber-soft:#FFF4CC; --violet:#5B4B9A; --violet-soft:#EEEAF8 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --amber:#E9C46A; --amber-soft:#3B3418; --violet:#B8A9EC; --violet-soft:#2A2540 } }
:root[data-theme="dark"]{ --amber:#E9C46A; --amber-soft:#3B3418; --violet:#B8A9EC; --violet-soft:#2A2540 }

.time{display:inline-block; font-size:13px; font-weight:600; color:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:1px 10px; margin-left:8px; vertical-align:2px; background:var(--surface)}
.toc .mins{margin-left:auto; color:var(--muted); font-size:12px; font-family:var(--mono)}
.plan .m{grid-row:span 2; justify-self:end; color:var(--muted); font-family:var(--mono); font-size:14px}
.plan a{grid-template-columns:44px 1fr auto}

.flow{display:flex; flex-wrap:wrap; align-items:stretch; gap:6px; margin:16px 0}
.flow .nd{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--bg); min-width:120px; flex:1}
.flow .nd b{display:block; font-size:15px}
.flow .nd span{font-size:14px; color:var(--ink-2)}
.flow .nd.hi{border-color:var(--blue); background:var(--blue-soft)}
.flow .ar{align-self:center; color:var(--muted); font-size:20px}

.apps{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:14px 0}
.app{border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--bg)}
.app .ic{font-size:22px; line-height:1}
.app b{display:block; margin:6px 0 2px}
.app p{margin:0; font-size:15px; color:var(--ink-2)}

/* timeline */
.tl{list-style:none; margin:16px 0; padding:0; position:relative}
.tl::before{content:""; position:absolute; left:64px; top:6px; bottom:6px; width:2px; background:var(--line)}
.tl li{display:grid; grid-template-columns:52px 26px minmax(0,1fr); gap:0 0; padding:0 0 10px}
.tl .yr{font-family:var(--mono); font-weight:600; color:var(--ink-2); text-align:right; padding-top:9px; font-size:15px}
.tl .dot{width:14px; height:14px; border-radius:50%; background:var(--bg); border:3px solid var(--blue); margin:12px 0 0 5px; position:relative; z-index:1}
.tl li[data-era="classic"] .dot{border-color:var(--muted)}
.tl li[data-era="feature"] .dot{border-color:var(--green)}
.tl li[data-era="deep"] .dot{border-color:var(--blue)}
.tl li[data-era="found"] .dot{border-color:var(--violet)}
.tl details{border:1px solid var(--line); border-radius:10px; background:var(--bg); margin-left:8px}
.tl summary{cursor:pointer; padding:8px 12px; font-weight:600; list-style:none}
.tl summary::-webkit-details-marker{display:none}
.tl summary small{font-weight:400; color:var(--muted); margin-left:6px}
.tl details p{margin:0; padding:0 12px 10px; color:var(--ink-2); font-size:15px}
.tl li.star details{border-color:var(--blue); background:var(--blue-soft)}
.eras{display:flex; flex-wrap:wrap; gap:12px; font-size:14px; color:var(--ink-2); margin:6px 0}
.eras i{display:inline-block; width:11px; height:11px; border-radius:50%; border:3px solid; margin-right:6px; vertical-align:-1px}

.pair{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:620px; margin:10px 0}
.pair button{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:14px; cursor:pointer; text-align:left; font-weight:600; min-height:70px}
.pair button:hover{border-color:var(--blue)}
.pair button.right{border-color:var(--green); background:var(--green-soft)}
.pair button.wrong{border-color:var(--red); background:var(--red-soft)}
.pair small{display:block; font-weight:400; color:var(--muted); margin-top:4px}

.eq-tab{border-collapse:collapse; font-family:var(--mono); font-size:14px; margin:8px 0}
.eq-tab th,.eq-tab td{border:1px solid var(--line); padding:5px 9px; text-align:center}
.eq-tab th{background:var(--surface); font-family:var(--sans); font-weight:600}
.eq-tab input{width:46px; text-align:center; border:1px solid var(--line); border-radius:4px; padding:2px; background:var(--bg); font-family:var(--mono)}
.eq-tab input.right{background:var(--green-soft); border-color:var(--green)}
.eq-tab input.wrong{background:var(--red-soft); border-color:var(--red)}

.dl-row{gap:12px}
.dl img{object-fit:cover}
.exp{margin:14px 0 6px; border:1px solid var(--line); border-radius:10px; padding:10px; background:#fff}
.exp img{width:100%; height:auto; display:block; border-radius:6px}
.exp.narrow{max-width:420px}
.view canvas.free{aspect-ratio:auto}
.views.wide{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.canvas-box{border:1px solid var(--line); border-radius:6px; background:var(--bg); display:block; width:100%; height:auto}
.legend b{font-weight:600}
.mono{font-family:var(--mono)}
.big-num{font-family:var(--serif); font-size:26px; color:var(--blue); font-weight:700}
.kv{display:grid; grid-template-columns:auto auto; gap:2px 14px; font-size:15px; width:max-content}
.kv span:nth-child(odd){color:var(--ink-2)}
.kv span:nth-child(even){font-family:var(--mono); font-weight:600}
.colab{font-size:15px}
.pill{display:inline-block; border-radius:999px; padding:1px 9px; font-size:13px; font-weight:600; background:var(--surface); border:1px solid var(--line); color:var(--ink-2)}
.pill.ok{background:var(--green-soft); border-color:var(--green); color:var(--green)}
.callout.amber{border-color:var(--amber); background:var(--amber-soft)}
.sam-wrap{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:760px){ .sam-wrap{grid-template-columns:1fr} .pair{grid-template-columns:1fr} }

</style>

function hl(line, lang){
  const ch = lang==="py" ? "#" : "%"; let q=null;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c===q) q=null; continue; }
    if(c==='"'||(c==="'" && !(lang==="m" && i>0 && /[\w)\]}.']/.test(line[i-1])))){ q=c; continue; }
    if(c===ch) return esc(line.slice(0,i))+`<span class="com">${esc(line.slice(i))}</span>`; }
  return esc(line);
}

const cache={};
function loadImg(key){
  if(cache[key]) return Promise.resolve(cache[key]);
  return new Promise((res,rej)=>{
    const im=new Image(); im.onload=()=>{
      const w=im.naturalWidth, h=im.naturalHeight; const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.drawImage(im,0,0); const d=x.getImageData(0,0,w,h).data; const g=new Uint8ClampedArray(w*h);
      for(let i=0;i<w*h;i++) g[i]=Math.round(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]);
      cache[key]={w,h,rgba:d,gray:g,img:im}; res(cache[key]);
    }; im.onerror=rej; im.src=IMG[key];
  });
}

function histOf(g){ const h=new Array(256).fill(0); for(const v of g) h[v]++; return h; }

function otsuCurve(g){
  const h=histOf(g), tot=g.length; let sum=0; for(let i=0;i<256;i++) sum+=i*h[i];
  let sB=0,wB=0,best=-1,th=0; const sig=new Array(256).fill(0);
  for(let t=0;t<256;t++){ wB+=h[t]; if(!wB) continue; const wF=tot-wB; if(!wF) break; sB+=t*h[t];
    const mB=sB/wB, mF=(sum-sB)/wF; const v=wB*wF*(mB-mF)*(mB-mF)/(tot*tot); sig[t]=v; if(v>best){best=v; th=t;} }
  return {t:th, sig};
}
function convW(g,w,h,k,kw){
  const kh=k.length/kw, r=(kw-1)>>1, rh=(kh-1)>>1, out=new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let s=0;
    for(let j=0;j<kh;j++){ const yy=Math.min(h-1,Math.max(0,y+j-rh)); for(let i=0;i<kw;i++){ const xx=Math.min(w-1,Math.max(0,x+i-r)); s+=k[j*kw+i]*g[yy*w+xx]; } }
    out[y*w+x]=s; }

function blurW(g,w,h,sigma){
  const r=Math.max(1,Math.ceil(sigma*2.5)); const k=[]; let s=0; for(let i=-r;i<=r;i++){ const v=Math.exp(-(i*i)/(2*sigma*sigma)); k.push(v); s+=v; }

function cannyW(g,w,h,lo,hi,sigma){ // lo/hi on Sobel magnitude scale (like OpenCV)
  const b=sigma>0?blurW(g,w,h,sigma):g;
  const gx=convW(b,w,h,[-1,0,1,-2,0,2,-1,0,1],3), gy=convW(b,w,h,[-1,-2,-1,0,0,0,1,2,1],3);
  const m=new Float32Array(w*h); for(let i=0;i<w*h;i++) m[i]=Math.abs(gx[i])+Math.abs(gy[i]);
  const nms=new Float32Array(w*h);
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x; let a=Math.atan2(gy[i],gx[i])*180/Math.PI; if(a<0) a+=180; let p,q;
    if(a<22.5||a>=157.5){p=m[i-1];q=m[i+1];} else if(a<67.5){p=m[i-w+1];q=m[i+w-1];} else if(a<112.5){p=m[i-w];q=m[i+w];} else {p=m[i-w-1];q=m[i+w+1];}
    nms[i]=(m[i]>=p&&m[i]>q)?m[i]:0; }

  for(let i=0;i<w*h;i++) if(nms[i]>=hi){ out[i]=255; st.push(i); }
  while(st.length){ const i=st.pop(), y=(i/w)|0, x=i%w;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const yy=y+dy,xx=x+dx; if(yy<0||xx<0||yy>=h||xx>=w) continue; const j=yy*w+xx; if(!out[j]&&nms[j]>=lo){ out[j]=255; st.push(j);} } }

/* histogram drawing with optional curve (0..1 per level) and vertical marker */
function drawHist(cv, g, o={}){

  x.fillStyle=o.color||css('--blue');
  for(let i=0;i<256;i++){ const v=Math.min(h[i],mx)/mx*(H-30); x.fillRect(i*2,H-16-v,2,v); }

/* 3. Timeline + "which came first" */
const TL=[
 [1966,"MIT Summer Vision Project","classic","A summer project hoped to 'solve' vision by connecting a camera to a computer. It became a 60-year research field. (Just before our 50-year window, but where it all began.)"],
 [1980,"Neocognitron (Fukushima)","classic","A layered network inspired by the visual cortex, with simple and complex cells. The ancestor of today's CNNs."],
 [1981,"Optical flow: Horn–Schunck and Lucas–Kanade","classic","Two ways to estimate how every pixel moves between video frames. Still used for tracking and video stabilisation."],
 [1982,"Marr's book 'Vision'","classic","David Marr described vision as a pipeline from the raw image to a 2.5-D sketch to a 3-D model. It shaped how the field thought for decades."],
 [1986,"Canny edge detector","classic","Smooth, gradient, non-maximum suppression, hysteresis. You will run cv2.Canny today; the method is from 1986."],
 [1988,"Harris corner detector","classic","Finds corners that can be matched between images: the basis of image stitching and tracking."],
 [1989,"CNN trained with back-propagation (LeCun)","deep","Read handwritten ZIP codes for the US postal service. The first practical convolutional neural network."],
 [1991,"Eigenfaces (Turk & Pentland)","classic","Face recognition using principal components of face images."],
 [1998,"LeNet-5 and the MNIST dataset","deep","A 7-layer CNN read cheques in banks. MNIST became the 'hello world' of machine learning."],
 [1999,"SIFT features (Lowe)","feature","Keypoints that survive scaling and rotation. Ruled object recognition, panoramas and 3-D reconstruction for a decade."],
 [2000,"OpenCV first public release","feature","Intel's open-source vision library. Today it has 2,500+ algorithms; you will use it in Practical 3."],
 [2001,"Viola–Jones face detector","feature","Real-time face detection with Haar features and a cascade. Brought face boxes to every digital camera."],
 [2005,"HOG pedestrian detector, PASCAL VOC","feature","Histograms of Oriented Gradients for detecting people; PASCAL VOC gave the field a shared benchmark."],
 [2009,"ImageNet dataset","deep","14 million labelled images in 20,000+ categories. The data that made deep learning possible.","star"],
 [2012,"AlexNet wins ImageNet","deep","A GPU-trained CNN cut the top-5 error from 26% to 15%. The moment deep learning took over computer vision.","star"],
 [2014,"R-CNN, GANs, VGG, MS COCO","deep","Deep object detection (R-CNN), image generation (GANs) and the COCO dataset whose 80 classes YOLO still uses today."],
 [2015,"ResNet, U-Net, Faster R-CNN, YOLO","deep","Very deep networks with skip connections; U-Net for medical segmentation; and YOLO: detection in a single pass.","star"],
 [2017,"Mask R-CNN; the Transformer","deep","Instance segmentation by adding a mask branch to a detector. The Transformer (for language) later reached vision."],
 [2020,"Vision Transformer (ViT), DETR, NeRF","found","Images cut into patches and processed like words; detection with transformers; 3-D scenes from photos."],
 [2021,"CLIP","found","Learned images and text together from 400 million pairs, so models can recognise things described in words."],

 [2023,"Segment Anything (SAM), YOLOv8","found","SAM segments any object from a click or box, trained on 1.1 billion masks. You will run it in Practical 5.","star"],
 [2024,"SAM 2, YOLO11","found","SAM 2 segments and tracks objects in video too. YOLO11 is the detector you will use in Practical 4."],
 [2025,"SAM 3 and vision-language models","found","SAM 3 segments every instance of a concept you name in words, such as 'yellow school bus'. Detection, segmentation and language are merging."]
];

/* 4. Contrast stretching */
function demoStretch(el){
  let mode="mm", r1=90, r2=140;
  el.innerHTML=tryBox("Contrast stretching on the moon","A low-contrast image: most pixels sit between about 60 and 140",
   `<div class="controls">${seg([["mm","Min–max stretch"],["pc","Ignore 1% at each end (stretchlim)"],["man","Choose r1, r2 yourself"]],mode,"stseg")}
     <span id="stman" hidden>${slider("r1","r1",0,254,1,r1)} ${slider("r2","r2",1,255,1,r2)}</span></div>
    <div class="views wide">${view("s1","Input")}${view("s2","Stretched")}<div class="view"><figure><canvas id="s3" style="aspect-ratio:1/1; background:var(--bg)"></canvas><figcaption><span>Transfer function s = T(r)</span><span></span></figcaption></figure></div></div>
    <div class="views wide" style="margin-top:10px">${hview("s4","Histogram before")}${hview("s5","Histogram after")}</div>
    <p class="note" id="stn"></p>`);
  loadImg('moon').then(I=>{
    drawGray(el.querySelector('#s1'),I.gray,I.w,I.h);
    let mn=255,mx=0; for(const v of I.gray){ if(v<mn) mn=v; if(v>mx) mx=v; }
    const p1=pct(I.gray,0.01), p2=pct(I.gray,0.99-1e-9);
    drawHist(el.querySelector('#s4'),I.gray);
    const run=()=>{
      let a,b; if(mode==="mm"){a=mn;b=mx;} else if(mode==="pc"){a=p1;b=p2;} else {a=Math.min(r1,r2-1);b=Math.max(r2,a+1);}
      const L=new Array(256); for(let r=0;r<256;r++) L[r]=Math.max(0,Math.min(255,Math.round((r-a)*255/(b-a))));
      const out=lut(I.gray,L); drawGray(el.querySelector('#s2'),out,I.w,I.h); drawHist(el.querySelector('#s5'),out);
      const c=el.querySelector('#s3'); c.width=300; c.height=300; const x=c.getContext('2d'); x.fillStyle=css('--bg'); x.fillRect(0,0,300,300);
      x.strokeStyle=css('--line'); x.strokeRect(20,10,270,270); x.setLineDash([4,4]); x.beginPath(); x.moveTo(20,280); x.lineTo(290,10); x.stroke(); x.setLineDash([]);
      x.strokeStyle=css('--blue'); x.lineWidth=3; x.beginPath(); for(let r=0;r<256;r++){ const px=20+r*270/255, py=280-L[r]*270/255; r?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
      x.fillStyle=css('--muted'); x.font='12px sans-serif'; x.fillText('r (input) →',200,296); x.save(); x.translate(12,120); x.rotate(-Math.PI/2); x.fillText('s (output) →',0,0); x.restore();
      el.querySelector('#stn').innerHTML = mode==="mm" ? `r<sub>min</sub> = <b>${mn}</b>, r<sub>max</sub> = <b>${mx}</b>. A handful of pixels are already pure black and pure white, so the formula maps 0→0 and 255→255 and <b>nothing changes</b>. Outliers defeat a plain min–max stretch.`
        : mode==="pc" ? `Ignoring the darkest and brightest 1% gives r1 = <b>${a}</b>, r2 = <b>${b}</b> (in this smaller preview). Everything between them is spread over 0–255: the craters appear. This is what MATLAB's <code>imadjust(I, stretchlim(I))</code> does.`
        : `Pixels below ${a} become black, above ${b} white, and the range in between is stretched linearly. A steeper line means more contrast in that range.`;
    };
    bindSeg(el.querySelector('#stseg'),v=>{mode=v; el.querySelector('#stman').hidden=v!=="man"; run();});
    el.querySelector('#r1').oninput=e=>{ r1=+e.target.value; el.querySelector('#r1o').textContent=r1; run(); };
    el.querySelector('#r2').oninput=e=>{ r2=+e.target.value; el.querySelector('#r2o').textContent=r2; run(); };
    run();
  });
}

function demoEqTable(el){
  const n=[790,1023,850,656,329,245,122,81], MN=4096; let c=0; const cum=n.map(v=>c+=v); const ans=cum.map(v=>Math.round(7*v/MN));
  const st=S.inputs.eq=S.inputs.eq||{};
  el.innerHTML=tryBox("Be the computer: equalize a 3-bit image by hand","64 x 64 image, 8 gray levels (L = 8), MN = 4096 pixels",
   `<div class="tbl-wrap" style="border:0"><table class="eq-tab"><tr><th>r<sub>k</sub></th>${n.map((_,k)=>`<td>${k}</td>`).join('')}</tr>
    <tr><th>n<sub>k</sub></th>${n.map(v=>`<td>${v}</td>`).join('')}</tr>
    <tr><th>p(r<sub>k</sub>) = n<sub>k</sub>/MN</th>${n.map(v=>`<td>${(v/MN).toFixed(2)}</td>`).join('')}</tr>
    <tr><th>Σ p (CDF)</th>${cum.map((v,k)=>`<td>${k<2?(v/MN).toFixed(2):'?'}</td>`).join('')}</tr>
    <tr><th>s<sub>k</sub> = round(7 × CDF)</th>${n.map((_,k)=>`<td><input inputmode="numeric" data-k="${k}" value="${esc(st[k]??'')}" aria-label="s${k}"></td>`).join('')}</tr></table></div>
    <div class="row"><button class="btn sm" id="eqc">Check</button><button class="btn ghost sm" id="eqs">Show working</button><span id="eqf" class="fb"></span></div><div id="eqw" class="note"></div>`);
  const ins=el.querySelectorAll('.eq-tab input'); ins.forEach(i=>i.oninput=()=>{ st[i.dataset.k]=i.value; save(); });
  el.querySelector('#eqc').onclick=()=>{ let ok=0; ins.forEach(i=>{ const k=+i.dataset.k; const r=i.value.trim()!==''&&+i.value===ans[k]; i.classList.toggle('right',r); i.classList.toggle('wrong',!r); if(r) ok++; });
    const f=el.querySelector('#eqf'); f.className='fb '+(ok===8?'good':'bad'); f.textContent= ok===8?'All 8 correct. Notice levels 3 and 4 both became 6: equalization can merge levels.':`${ok} of 8 correct. Keep adding p(r) from the left, then multiply by 7.`; };
  el.querySelector('#eqs').onclick=()=>{ el.querySelector('#eqw').innerHTML=cum.map((v,k)=>`s<sub>${k}</sub> = 7 × ${(v/MN).toFixed(3)} = ${(7*v/MN).toFixed(2)} → <b>${ans[k]}</b>`).join('<br>'); };
}

/* 6. Otsu */
function demoOtsu(el){
  let t=128;
  el.innerHTML=tryBox("Find the threshold for the coins","Move T, or let Otsu choose it",
   `<div class="controls">${slider("ot","Threshold T",0,255,1,t)}<button class="btn ghost sm" id="otb">Use Otsu</button></div>
    <div class="views wide">${view("o1","coins.png","free")}${view("o2","I > T","free")}</div>
    <div class="views wide" style="margin-top:10px">${hview("o3","Histogram and threshold")}${hview("o4","Between-class variance σ²_B(T)")}</div>
    <p class="note" id="on"></p>`);
  loadImg('coins').then(I=>{
    const {t:ot,sig}=otsuCurve(I.gray); const mx=Math.max(...sig);
    drawGray(el.querySelector('#o1'),I.gray,I.w,I.h);
    const run=()=>{ const b=new Uint8ClampedArray(I.w*I.h); for(let i=0;i<b.length;i++) b[i]=I.gray[i]>t?255:0;
      drawGray(el.querySelector('#o2'),b,I.w,I.h); el.querySelector('#o2-n').textContent=Math.round(count(b)/b.length*100)+'% white';
      drawHist(el.querySelector('#o3'),I.gray,{mark:t});
      drawHist(el.querySelector('#o4'),new Array(256).fill(0),{curve:sig.map(v=>v/mx),mark:t,curveColor:css('--green')});
      el.querySelector('#on').innerHTML=`At T = <b>${t}</b>, σ²<sub>B</sub> is <b>${Math.round(sig[t]/mx*100)}%</b> of its maximum. Otsu tries every T and keeps the one with the largest between-class variance: <b>T = ${ot}</b> (level = ${ot}/255 = ${(ot/255).toFixed(3)} in this preview). ${t<70?'Too low: the dark background turns white.':t>160?'Too high: the coins break into fragments.':''}`; };
    el.querySelector('#ot').oninput=e=>{ t=+e.target.value; el.querySelector('#oto').textContent=t; run(); };
    el.querySelector('#otb').onclick=()=>{ t=ot; el.querySelector('#ot').value=t; el.querySelector('#oto').textContent=t; run(); };
    run();
  });
}

/* 9. IoU */
function demoIoU(el){
  el.innerHTML=tryBox("Intersection over Union","Drag the blue prediction box. Green is the ground truth.",
   `<div class="row" style="gap:20px; align-items:flex-start"><canvas id="iou" width="420" height="280" class="canvas-box" style="max-width:420px; touch-action:none; cursor:grab"></canvas>
    <div><div class="kv"><span>Intersection</span><span id="i1"></span><span>Union</span><span id="i2"></span><span>IoU</span><span id="i3"></span></div><p class="note" id="i4"></p></div></div>`);
  const cv=el.querySelector('#iou'), x=cv.getContext('2d'); const G={x:120,y:70,w:150,h:130}; let P={x:170,y:110,w:150,h:130}, drag=null;
  const draw=()=>{ x.fillStyle=css('--surface'); x.fillRect(0,0,420,280);
    const ix=Math.max(0,Math.min(G.x+G.w,P.x+P.w)-Math.max(G.x,P.x)), iy=Math.max(0,Math.min(G.y+G.h,P.y+P.h)-Math.max(G.y,P.y)); const I=ix*iy, U=G.w*G.h+P.w*P.h-I;
    if(I){ x.fillStyle='rgba(242,165,65,.55)'; x.fillRect(Math.max(G.x,P.x),Math.max(G.y,P.y),ix,iy); }
    x.lineWidth=3; x.strokeStyle='#2E7D5B'; x.strokeRect(G.x,G.y,G.w,G.h); x.strokeStyle='#1F6FD1'; x.strokeRect(P.x,P.y,P.w,P.h);
    x.font='600 13px sans-serif'; x.fillStyle='#2E7D5B'; x.fillText('ground truth',G.x,G.y-6); x.fillStyle='#1F6FD1'; x.fillText('prediction',P.x,P.y+P.h+16);
    const v=I/U; el.querySelector('#i1').textContent=Math.round(I)+' px²'; el.querySelector('#i2').textContent=Math.round(U)+' px²'; el.querySelector('#i3').textContent=v.toFixed(2);
    el.querySelector('#i4').innerHTML= v>=0.5?`IoU ≥ 0.5: counted as a <b class="res ok">correct detection</b> (true positive) under the usual rule.`:`IoU < 0.5: counted as a <b class="res bad">miss</b> (false positive), even though the boxes overlap.`; };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*420, y:(e.clientY-r.top)/r.height*280}; };
  cv.addEventListener('pointerdown',e=>{ const p=pos(e); if(p.x>=P.x&&p.x<=P.x+P.w&&p.y>=P.y&&p.y<=P.y+P.h){ drag={dx:p.x-P.x,dy:p.y-P.y}; cv.setPointerCapture(e.pointerId); } });
  cv.addEventListener('pointermove',e=>{ if(!drag) return; const p=pos(e); P.x=Math.max(0,Math.min(420-P.w,p.x-drag.dx)); P.y=Math.max(0,Math.min(280-P.h,p.y-drag.dy)); draw(); });
  cv.addEventListener('pointerup',()=>drag=null); draw();
}

/* 10. NMS */
function demoNMS(el){
  let conf=0.25, iouT=0.45, on=true;
  el.innerHTML=tryBox("Confidence threshold and Non-Maximum Suppression","Raw predictions for the bus photo: many overlapping boxes per object",
   `<div class="controls">${slider("nc","conf",0.05,0.95,0.05,conf,v=>(+v).toFixed(2))} ${slider("ni","NMS IoU",0.1,0.9,0.05,iouT,v=>(+v).toFixed(2))}<label class="slider"><input type="checkbox" id="nn" checked style="width:auto"> Apply NMS</label></div>
    <div class="row" style="gap:20px; align-items:flex-start"><canvas id="nmc" class="canvas-box" style="max-width:300px"></canvas><p class="note" id="nmt" style="flex:1; min-width:220px; margin:0"></p></div>`);
  // build jittered candidates around real detections (deterministic)
  let seed=7; const R=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const cands=[]; BUSSEG.forEach(o=>{ const [x1,y1,x2,y2]=o.b; const w=x2-x1,h=y2-y1; cands.push({n:o.n,s:o.c,b:o.b});
    for(let k=0;k<4;k++){ const j=()=> (R()-0.5); cands.push({n:o.n,s:Math.max(0.06,o.c-0.1-R()*0.45),b:[x1+j()*w*0.25,y1+j()*h*0.2,x2+j()*w*0.25,y2+j()*h*0.2]}); } });
  cands.push({n:'person',s:0.12,b:[560,420,640,640]},{n:'car',s:0.09,b:[20,240,120,330]});
  const iou=(a,b)=>{ const ix=Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0])), iy=Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1])); const I=ix*iy; return I/((a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-I); };
  loadImg('bus').then(I=>{ const cv=el.querySelector('#nmc'); const s=I.w/810;
    const run=()=>{ let keep=cands.filter(c=>c.s>=conf).sort((a,b)=>b.s-a.s); const before=keep.length;
      if(on){ const out=[]; keep.forEach(c=>{ if(!out.some(o=>o.n===c.n&&iou(o.b,c.b)>iouT)) out.push(c); }); keep=out; }
      cv.width=I.w; cv.height=I.h; const x=cv.getContext('2d'); x.drawImage(I.img,0,0); x.lineWidth=2;
      keep.forEach(c=>{ const [x1,y1,x2,y2]=c.b.map(v=>v*s); x.strokeStyle=c.n==='bus'?'#F2A541':c.n==='person'?'#E4572E':'#2E86AB'; x.globalAlpha=0.35+0.65*c.s; x.strokeRect(x1,y1,x2-x1,y2-y1); });
      x.globalAlpha=1;
      el.querySelector('#nmt').innerHTML=`<b>${cands.length}</b> raw boxes → <b>${before}</b> after the confidence filter → <b>${keep.length}</b> ${on?'after NMS':'(NMS off)'}.<br><br>${on?(keep.length<=7?'Each object now has one box: NMS kept the highest-scoring box and removed boxes of the same class that overlap it by more than the IoU threshold.':'Some objects still have several boxes. Lower the NMS IoU threshold.'):'Without NMS every object is covered by a cluster of near-duplicate boxes.'}`; };
    el.querySelector('#nc').oninput=e=>{ conf=+e.target.value; el.querySelector('#nco').textContent=conf.toFixed(2); run(); };
    el.querySelector('#ni').oninput=e=>{ iouT=+e.target.value; el.querySelector('#nio').textContent=iouT.toFixed(2); run(); };
    el.querySelector('#nn').onchange=e=>{ on=e.target.checked; run(); };
    run(); });
}

/* 11. SAM click-to-segment (real SAM 2.1 masks, precomputed for a grid of clicks) */
let SAMDEC=null;
function samMask(i){ SAMDEC=SAMDEC||[]; if(SAMDEC[i]) return SAMDEC[i];
  const runs=SAMGRID.masks[i].split(',').map(v=>parseInt(v,36)); const m=new Uint8Array(SAMGRID.w*SAMGRID.h); let p=0,v=0; for(const r of runs){ if(v) m.fill(1,p,p+r); p+=r; v=1-v; } return SAMDEC[i]=m; }
function demoSAM(el){
  let pt=[300,180], pick=-1;
  el.innerHTML=tryBox("Click anywhere to prompt SAM","Real SAM 2.1 masks, computed in advance for a 30 x 20 grid of clicks on coffee.png",
   `<div class="sam-wrap"><canvas id="smc" class="canvas-box" style="cursor:crosshair"></canvas>
    <div><p style="margin:0 0 6px; font-weight:600" id="smp"></p><div class="chips" id="smk"></div><p class="note" id="smn" style="margin:0"></p></div></div>`);
  loadImg('coffee').then(I=>{ const cv=el.querySelector('#smc'); const sx=I.w/SAMGRID.w, sy=I.h/SAMGRID.h; const sc=600/I.w; // image coords in original 600x400
    const cell=()=>{ const gx=Math.max(0,Math.min(SAMGRID.grid[0].length-1,Math.round((pt[0]-10)/SAMGRID.step))), gy=Math.max(0,Math.min(SAMGRID.grid.length-1,Math.round((pt[1]-10)/SAMGRID.step))); return SAMGRID.grid[gy][gx]; };
    const run=()=>{ cv.width=I.w; cv.height=I.h; const x=cv.getContext('2d'); x.drawImage(I.img,0,0);
      const opts=cell(); if(pick<0) pick=opts.reduce((b,o,i)=>o[1]>opts[b][1]?i:b,0); if(pick>=opts.length) pick=Math.max(0,opts.length-1);
      el.querySelector('#smp').textContent=`Point prompt: points=[[${Math.round(pt[0])}, ${Math.round(pt[1])}]], labels=[1]`;
      el.querySelector('#smk').innerHTML=opts.map((o,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===pick}">${['Small','Medium','Large'][i]||'Mask '+(i+1)} · score ${o[1].toFixed(2)}</button>`).join('')||'<span class="muted">No confident mask here: try another spot.</span>';
      el.querySelectorAll('#smk .chip').forEach(b=>b.onclick=()=>{ pick=+b.dataset.i; run(); });
      if(opts.length){ const m=samMask(opts[pick][0]); const id=x.getImageData(0,0,I.w,I.h); let area=0;
        for(let y=0;y<I.h;y++) for(let xx=0;xx<I.w;xx++){ if(m[Math.floor(y/sy)*SAMGRID.w+Math.floor(xx/sx)]){ const k=(y*I.w+xx)*4; id.data[k]=id.data[k]*0.45+30*0.55; id.data[k+1]=id.data[k+1]*0.45+144*0.55; id.data[k+2]=id.data[k+2]*0.45+255*0.55; area++; } }
        x.putImageData(id,0,0); el.querySelector('#smn').innerHTML=`This mask covers <b>${(area/(I.w*I.h)*100).toFixed(1)}%</b> of the image. ${opts.length>1?'One click can be <b>ambiguous</b> (the handle? the cup? cup and saucer?), so SAM returns up to three nested masks with a confidence score each.':''}`; }
      x.fillStyle='#39FF14'; x.strokeStyle='#000'; x.lineWidth=2; x.beginPath(); x.arc(pt[0]/sc,pt[1]/sc,6,0,7); x.fill(); x.stroke(); };
    cv.addEventListener('click',e=>{ const r=cv.getBoundingClientRect(); pt=[(e.clientX-r.left)/r.width*600,(e.clientY-r.top)/r.height*400]; pick=-1; run(); });
    run(); });
}

function fillCode(c){ return c.replace(/\{\{(.+?)\}\}/g,(m,a)=>a); }
function cmdsIn(c){ const out=[]; c.replace(/\{\{(.+?)\}\}/g,(m,a)=>{ out.push(a); return m; }); return [...new Set(out)]; }
function renderSteps(host, key, steps, lang){
  const st=S.steps[key]=S.steps[key]||{}; const n=steps.length; const tool=lang==='py'?'Python':'MATLAB';
  host.innerHTML=`<div class="counter"><span></span><span class="bar"><i></i></span></div><ol class="steps"></ol>`;
  const paint=()=>{ const d=Object.values(st).filter(Boolean).length; host.querySelector('.counter span').textContent=`${d} of ${n} steps done in ${tool}`; host.querySelector('.counter i').style.width=(d/n*100)+'%'; };
  const ol=host.querySelector('ol');
  steps.forEach((s,i)=>{ const ok=!!st[i]; const cm=cmdsIn(s.c); const li=document.createElement('li'); li.className='step'+(ok?' ok':'');
    li.innerHTML=`<span class="num">${ok?'&#10003;':i+1}</span><div><h4>${s.t}</h4><p class="ins">${s.i}</p>
      ${cm.length?`<p class="use">Use: ${cm.map(c=>`<code>${esc(c)}</code>`).join(' ')}</p>`:''}
      ${s.chk?`<p class="see"><b>Check:</b> ${s.chk}</p>`:''}
      <details class="peek"><summary>Stuck? Show a hint for this step</summary>${codeBlock(fillCode(s.c),lang)}${s.w?`<div class="why">${s.w}</div>`:''}</details>
      <label class="tickbox"><input type="checkbox" ${ok?'checked':''}> Done in ${tool}</label></div>`;
    ol.appendChild(li);
    li.querySelector('.tickbox input').onchange=e=>{ st[i]=e.target.checked; save(); syncProgress(); li.classList.toggle('ok',e.target.checked);
      li.querySelector('.num').innerHTML=e.target.checked?'&#10003;':i+1; paint(); renderToc();
      if(e.target.checked){ toast(`Step ${i+1} done`); if(Object.values(st).filter(Boolean).length===n) toast('All steps done: compare with the Expected output page'); } };
  });
  paint();
}

{id:"cv-why", group:"1 · Computer vision", title:"Why do we need it?", min:3, render(el){

{id:"ip-contrast", group:"3 · Image processing (MATLAB)", title:"Histogram & contrast stretching", min:5, render(el){
  el.innerHTML=`<p class="kicker">Image processing · theory</p><h2>Histograms and contrast stretching <span class="time">5 min</span></h2>
  <p class="lead">A <b>histogram</b> counts how many pixels have each gray level 0–255. Its shape tells you about the image before you even look at it.</p>
  <div class="cols"><div class="box"><h4>Dark image</h4><p>Histogram crowded on the left.</p></div><div class="box"><h4>Bright image</h4><p>Crowded on the right.</p></div><div class="box"><h4>Low contrast</h4><p>A narrow peak: only a few gray levels are used.</p></div><div class="box"><h4>High contrast</h4><p>Spread across the whole range.</p></div></div>
  <h3>Contrast stretching</h3>
  <p class="prose">A <b>point operation</b>: each output pixel depends only on the input pixel at the same place, s = T(r). Linear stretching maps the input range [r<sub>min</sub>, r<sub>max</sub>] onto the full range [0, 255]:</p>
  <div class="formula">s = (r − r<sub>min</sub>) × 255 / (r<sub>max</sub> − r<sub>min</sub>)</div>
  <p class="prose">It keeps the shape of the histogram but spreads it out. Its weakness: a few extreme pixels (outliers) set r<sub>min</sub> and r<sub>max</sub>. The robust fix is to ignore a small percentage at each end, as MATLAB's <code>stretchlim</code> does.</p>
  <div id="w"></div>`;
  demoStretch(el.querySelector('#w'));
  quick(el,'q-stretch',[{q:"An image uses gray levels 50 to 100 only. With min–max stretching, level 75 becomes about…",o:["75","128","150","255"],a:1,e:"(75 − 50) × 255 / (100 − 50) = 127.5, so about 128."}]);
}},
{id:"ip-eq", group:"3 · Image processing (MATLAB)", title:"Histogram equalization", min:5, render(el){
  el.innerHTML=`<p class="kicker">Image processing · theory</p><h2>Histogram equalization <span class="time">5 min</span></h2>
  <p class="lead">Instead of a straight line, equalization uses the image's own <b>cumulative distribution</b> as the mapping. Crowded gray levels get pulled apart, rare ones get squeezed, and the output histogram becomes roughly flat.</p>
  <div class="formula">s<sub>k</sub> = (L − 1) × Σ<sub>j=0..k</sub> n<sub>j</sub> / MN</div>
  <div class="prose"><ul><li><b>n<sub>j</sub></b>: number of pixels with gray level j; <b>MN</b>: total pixels; <b>L</b>: number of gray levels (256 for uint8).</li>
   <li>Fully automatic: no parameters to choose. MATLAB: <code>histeq</code>. OpenCV: <code>cv2.equalizeHist</code>.</li>
   <li>Can over-enhance noise and look harsh. <b>CLAHE</b> (<code>adapthisteq</code>, <code>cv2.createCLAHE</code>) equalizes small tiles with a limit and is common in medical imaging.</li></ul></div>
  <div id="w1"></div><div id="w2"></div>`;
  demoEqTable(el.querySelector('#w1')); demoEqualize(el.querySelector('#w2'));
  quick(el,'q-eq',[{q:"Contrast stretching vs equalization: which one changes the shape of the histogram?",o:["Contrast stretching","Histogram equalization","Both equally","Neither"],a:1,e:"Linear stretching only spreads the histogram; equalization redistributes levels to flatten it."}]);
}},

{id:"ip-seg", group:"3 · Image processing (MATLAB)", title:"Segmentation & Otsu", min:4, render(el){
  el.innerHTML=`<p class="kicker">Image processing · theory</p><h2>Segmentation by thresholding: Otsu's method <span class="time">4 min</span></h2>
  <p class="lead"><b>Segmentation</b> splits an image into meaningful regions. The simplest version is a global <b>threshold</b> T: pixels brighter than T are object (1), the rest background (0).</p>
  <div class="cols"><div class="box"><h4>Manual T</h4><p>Pick T by looking at the histogram. Works for one image, breaks on the next.</p></div>
   <div class="box"><h4>Otsu (1979)</h4><p>Try every T. Keep the one where the two classes are most separated: the largest <b>between-class variance</b>.</p></div>
   <div class="box"><h4>After thresholding</h4><p>Clean with morphology (<code>imfill</code>, <code>bwareaopen</code>), then <b>label</b> connected regions to count objects.</p></div></div>
  <div class="formula">σ²<sub>B</sub>(T) = ω<sub>0</sub>(T) · ω<sub>1</sub>(T) · [μ<sub>0</sub>(T) − μ<sub>1</sub>(T)]²</div>
  <p class="prose">ω<sub>0</sub>, ω<sub>1</sub> are the fractions of pixels below and above T, and μ<sub>0</sub>, μ<sub>1</sub> their mean gray levels. MATLAB's <code>graythresh</code> returns the best T as a <b>level</b> between 0 and 1 (T / 255). Otsu assumes a two-hump histogram and one global threshold: uneven lighting defeats it, which you will see in Practical 2.</p>
  <div id="w"></div>`;
  demoOtsu(el.querySelector('#w'));
  quick(el,'q-otsu',[{q:"graythresh returns 0.5. What is T for a uint8 image?",o:["0.5","50","127.5","255"],a:2,e:"level × 255 = 127.5."},{q:"Otsu works best when the histogram is…",o:["flat","bimodal (two humps)","a single narrow peak"],a:1,e:"Two well-separated humps give a clear valley to cut at."}]);
}},

{id:"cv2", group:"4 · OpenCV (Python)", title:"OpenCV essentials", min:4, render(el){
  el.innerHTML=`<p class="kicker">OpenCV · theory</p><h2>OpenCV essentials <span class="time">4 min</span></h2>
  <p class="lead"><b>OpenCV</b> is the most widely used open-source vision library (C++ core, Python bindings). In Python, an image is simply a <b>NumPy array</b>.</p>
  <div class="cols"><div class="box"><h4>Shape</h4><p><code>img.shape</code> → (height, width, channels). Rows first! A 1920 x 1080 photo has shape (1080, 1920, 3).</p></div>
   <div class="box"><h4>Indexing</h4><p><code>img[y, x]</code> is one pixel: [B, G, R]. <code>img[100:200, 50:150]</code> crops. Python counts from 0; MATLAB from 1.</p></div>
   <div class="box"><h4>dtype uint8</h4><p>0–255. <code>cv2.add</code> saturates (250 + 10 = 255); NumPy <code>+</code> wraps around (250 + 10 = 4).</p></div></div>
  <div id="w1"></div>
  <h3>Key functions</h3>${cmdTable([["cv2.imread / cv2.imwrite","Read and save images.","img = cv2.imread('a.png')"],["cv2.cvtColor","BGR↔RGB, BGR→GRAY, BGR→HSV …","cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)"],["cv2.resize","Change size.","cv2.resize(img, (320, 240))"],["cv2.GaussianBlur","Smooth / denoise.","cv2.GaussianBlur(g, (5, 5), 0)"],["cv2.threshold","Fixed or Otsu threshold.","cv2.threshold(g, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)"],["cv2.equalizeHist","Histogram equalization.","cv2.equalizeHist(g)"],["cv2.Canny","Edge detection.","cv2.Canny(g, 100, 200)"],["cv2.rectangle / cv2.putText","Draw boxes and labels.","cv2.rectangle(img, (x1, y1), (x2, y2), (0, 255, 0), 2)"]])}
  <h3>Edges with Canny</h3><p class="prose">Canny (1986) finds thin, connected edges in four stages: Gaussian smoothing → gradient magnitude and direction (Sobel) → non-maximum suppression (thin the ridges to one pixel) → hysteresis with two thresholds.</p>
  <div id="w2"></div>`;
  demoBGR(el.querySelector('#w1')); demoCanny(el.querySelector('#w2'));
  quick(el,'q-cv2',[{q:"img.shape returns (720, 1280, 3). The image width is…",o:["720","1280","3"],a:1,e:"Shape is (height, width, channels)."},{q:"With NumPy uint8 arrays, 250 + 10 gives…",o:["260","255","4"],a:2,e:"uint8 wraps around: 260 − 256 = 4. cv2.add would give 255."}]);
}},

{id:"yolo", group:"5 · Object detection", title:"Object detection with YOLO", min:5, render(el){
  el.innerHTML=`<p class="kicker">Object detection · theory</p><h2>Object detection with YOLO <span class="time">5 min</span></h2>
  <p class="lead"><b>Object detection</b> answers <i>what</i> and <i>where</i>: for every object, a class label, a confidence score and a bounding box. <b>YOLO</b> ("You Only Look Once", 2015) does it in a single pass of one neural network, fast enough for live video.</p>
  <div class="flow"><div class="nd"><b>Input</b><span>image resized to 640</span></div><div class="ar">→</div><div class="nd"><b>Backbone</b><span>CNN extracts features</span></div><div class="ar">→</div><div class="nd"><b>Neck</b><span>mixes small and large scales</span></div><div class="ar">→</div><div class="nd hi"><b>Head</b><span>box + class + confidence at every location</span></div><div class="ar">→</div><div class="nd"><b>Post-process</b><span>confidence filter + NMS</span></div></div>
  <div class="cols"><div class="box"><h4>Two-stage (R-CNN family)</h4><p>Propose regions first, then classify each. Accurate but slower.</p></div>
   <div class="box"><h4>One-stage (YOLO, SSD)</h4><p>Predict boxes and classes directly in one pass. Real time.</p></div>
   <div class="box"><h4>Versions</h4><p>YOLOv1 (2015) → … → YOLOv8 (2023) → YOLO11 (2024) → YOLO26 (2026, Ultralytics). Sizes n, s, m, l, x trade speed for accuracy.</p></div></div>
  <p class="prose">The pretrained models know the <b>80 COCO classes</b> (person, car, bus, dog, cup, …). Detections are judged with <b>IoU</b>, and a model's overall accuracy is reported as <b>mAP</b> (mean average precision over classes).</p>
  <div id="w1"></div><div id="w2"></div>`;
  demoIoU(el.querySelector('#w1')); demoNMS(el.querySelector('#w2'));
  quick(el,'q-yolo',[{q:"You raise conf from 0.25 to 0.7. The number of detections…",o:["can only go down or stay the same","can only go up","does not change"],a:0,e:"Boxes below the new threshold are dropped; no new boxes appear."},{q:"Why is YOLO fast?",o:["It uses no neural network","It predicts all boxes in one forward pass","It works only on gray images"],a:1,e:"One network pass, no separate region-proposal stage."}]);
}},

{id:"sam", group:"6 · Segment Anything", title:"Segment Anything (SAM)", min:4, render(el){
  el.innerHTML=`<p class="kicker">Segmentation · theory</p><h2>Segment Anything (SAM) <span class="time">4 min</span></h2>
  <p class="lead"><b>SAM</b> (Meta, 2023) is a <b>promptable</b> segmentation model: give it a click or a box, and it returns the mask of that object, even for objects it never saw in training. It was trained on <b>SA-1B</b>: 11 million images and 1.1 billion masks.</p>
  <div class="flow"><div class="nd"><b>Image encoder</b><span>large ViT, runs once per image</span></div><div class="ar">+</div><div class="nd"><b>Prompt encoder</b><span>points, boxes, masks (text in SAM 3)</span></div><div class="ar">→</div><div class="nd hi"><b>Mask decoder</b><span>light and fast: up to 3 masks + scores</span></div></div>
  <div class="cols"><div class="box"><h4>Prompts</h4><p>Positive point (label 1), negative point (label 0), box, or no prompt to "segment everything".</p></div>
   <div class="box"><h4>Versions</h4><p>SAM (2023) images · SAM 2 (2024) images and video with memory · SAM 3 (2025) segments every instance of a concept named in text.</p></div>
   <div class="box"><h4>vs YOLO</h4><p>YOLO knows <i>what</i> (80 classes) but gives boxes. SAM gives exact pixels but no class name. Together: auto-annotation.</p></div></div>
  <div id="w"></div>`;
  demoSAM(el.querySelector('#w'));
  quick(el,'q-sam',[{q:"Why can SAM answer each new click so quickly?",o:["The heavy image encoder runs once; only the light decoder runs per prompt","It skips the image","It uses the CPU only"],a:0,e:"The image embedding is computed once and reused for every prompt."},{q:"SAM's output for a box prompt is…",o:["a class name","a pixel mask","a caption"],a:1,e:"SAM returns masks; it does not name the object."}]);
}},

document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==="signin"){ try{ await window.FB.signIn(); }catch(err){ toast("Sign-in failed: "+(err.code||err.message)); } }
  if(b.dataset.act==="signout"){ try{ await window.FB.signOut(); }catch(err){} }
});
document.addEventListener('submit', async e=>{
  if(e.target.id!=="regForm") return; e.preventDefault();
  const f=e.target, er=f.querySelector('#regErr');
  const name=f.name.value.trim().replace(/\s+/g," "), enr=f.enr.value.trim().toUpperCase();
  if(!NAME_RE.test(name)){ er.textContent="Please enter your full name using letters only (2 to 60 characters)."; return; }
  if(!ENR_RE.test(enr)){ er.textContent="Enrollment number must be 4 to 20 letters or digits, with no spaces."; return; }
  if(!confirm(`Register as\n\n${name}\nEnrollment: ${enr}\n\nYou can't change this later.`)) return;
  const btn=f.querySelector('button[type=submit]'); btn.disabled=true; er.textContent="";
  try{ await window.FB.register(AUTH.user.uid, AUTH.user.email, name, enr);
    AUTH.profile={name, enrollment:enr, email:AUTH.user.email}; AUTH.state="in"; ATT={}; toast("Registered"); syncProgress(); onAuthUpdate();
  }catch(err){ btn.disabled=false;
    er.textContent=(err.code==="permission-denied")?"This enrollment number is already registered to another account. If it is yours, ask your teacher to reset it.":"Registration failed: "+(err.code||err.message); }
});
function onAuthUpdate(){ renderAcct(); if(typeof show==="function" && idx(cur)>=0) show(cur,true); }
async function onUser(u){
  AUTH.user=u; ATT=null;
  if(!u){ AUTH.state="out"; AUTH.profile=null; onAuthUpdate(); return; }
  AUTH.state="loading"; onAuthUpdate();
  try{ AUTH.profile=await window.FB.getProfile(u.uid); AUTH.state=AUTH.profile?"in":"unreg";
    if(AUTH.profile){ await pullProgress(); try{ await loadAttempts(true); }catch(e){ ATT={}; } } }
  catch(err){ AUTH.state="error"; AUTH.err=err.code||err.message; }
  onAuthUpdate();
}
function fbReady(){ if(!window.FB){ AUTH.state="off"; onAuthUpdate(); return; } window.FB.onChange(onUser); }
