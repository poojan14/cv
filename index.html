function progressDoc(){
  const steps={}; Object.keys(P).forEach(k=>{ const o=S.steps[k]||{}; const m={}; Object.keys(o).forEach(i=>{ if(o[i]===true) m[i]=true; }); steps[k]=m; });
  const quiz={}; Object.entries(S.quiz||{}).forEach(([k,o])=>{ quiz[k]={}; Object.entries(o).forEach(([i,v])=>{ if(typeof v==="number") quiz[k][i]=v; }); });
  const seen={}; Object.keys(S.seen||{}).forEach(k=>{ if(SECTIONS.some(s=>s.id===k)) seen[k]=true; });
  return {steps, quiz, seen};
}
function syncProgress(){
  if(AUTH.state!=="in") return; clearTimeout(syncT);
  syncT=setTimeout(()=>{ const d=progressDoc(); window.FB.saveProgress(AUTH.user.uid, d.steps, d.quiz, d.seen).catch(()=>{}); },1200);
}
async function pullProgress(){
  try{ const pr=await window.FB.getProgress(AUTH.user.uid);
    if(pr){ Object.entries(pr.steps||{}).forEach(([k,m])=>{ S.steps[k]=S.steps[k]||{}; Object.keys(m||{}).forEach(i=>{ if(m[i]) S.steps[k][i]=true; }); });
      Object.entries(pr.quiz||{}).forEach(([k,m])=>{ S.quiz[k]=S.quiz[k]||{}; Object.entries(m||{}).forEach(([i,v])=>{ if(S.quiz[k][i]===undefined) S.quiz[k][i]=v; }); });
      Object.keys(pr.seen||{}).forEach(k=>S.seen[k]=true); save(); } }catch(e){}
  syncProgress();
}

/* graded attempts: one record per question, checked by the database rules against a hidden key */
const GR=Object.assign({maxAttempts:4, penalty:0.25}, window.GRADING||{});
let ATT=null;
async function loadAttempts(force){
  if(ATT && !force) return ATT;
  const list=await window.FB.listAttempts(AUTH.user.uid);
  ATT={}; list.forEach(a=>{ (ATT[a.tid]=ATT[a.tid]||{})[a.qid]=a; }); return ATT;
}
const qMarks=a=>a&&a.correct?Math.max(0,1-GR.penalty*(a.n-1)):0;
function taskScore(tid){ const T=TASKS[tid], at=(ATT&&ATT[tid])||{}; let score=0, done=0;
  T.qs.forEach(q=>{ const a=at[q.id]; score+=qMarks(a); if(a&&(a.correct||a.n>=GR.maxAttempts)) done++; });
  return {score:Math.round(score*100)/100, max:T.qs.length, done, total:T.qs.length}; }
const taskDone=tid=>{ if(!ATT) return false; const s=taskScore(tid); return s.done===s.total; };
const fmtM=x=>(Math.round(x*100)/100).toString();

function fieldHTML(q, val, disabled){
  const name=`q_${q.id}`;
  if(q.type==="num") return `<input type="text" inputmode="decimal" name="${name}" value="${esc(val??"")}" autocomplete="off" aria-label="${esc(q.label)}" ${disabled?"disabled":""}>`;
  return `<div class="ch" role="radiogroup" aria-label="${esc(q.label)}">${q.opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o[0])}" ${String(val)===o[0]?"checked":""} ${disabled?"disabled":""}><span>${esc(o[1])}</span></label>`).join("")}</div>`;
}
function statusHTML(a){
  if(!a) return `<span class="muted">${GR.maxAttempts} attempts. Full mark on the first try, ${fmtM(GR.penalty)} less for each retry.</span>`;
  if(a.correct) return `<span class="res ok">&#10003; Correct</span> <span class="muted">on attempt ${a.n} &middot; ${fmtM(qMarks(a))} / 1 mark</span>`;
  const left=GR.maxAttempts-a.n;
  return left>0?`<span class="res bad">&#10007; Incorrect</span> <span class="muted">${left} attempt${left>1?"s":""} left. Recheck your output, change your answer and try again.</span>`:`<span class="res bad">&#10007; Incorrect</span> <span class="muted">No attempts left &middot; 0 / 1 mark</span>`;
}
function qBlock(q, i, a, draft, live){
  const locked=!live||(a&&(a.correct||a.n>=GR.maxAttempts));
  const val=a?(a.correct||a.n>=GR.maxAttempts?a.ans:(draft[q.id]??a.ans)):draft[q.id];
  const cls=a?(a.correct?" good":(a.n>=GR.maxAttempts?" bad":" retry")):"";
  return `<div class="tq${cls}" data-q="${q.id}"><span class="ql"><span class="pts">1 mark</span><span class="qn">${i+1}.</span>${esc(q.label)}</span>${fieldHTML(q,val,locked)}
    <div class="row qrow">${live&&!locked?`<button class="btn sm chkq" type="button">${a?"Check again":"Check answer"}</button>`:""}<span class="qstat" aria-live="polite">${live?statusHTML(a):""}</span></div></div>`;
}
/* expected output (practicals) + graded questions; also used for the exit quiz */
async function renderCheckpoint(el, tid, pid, img, note, narrow){
  const T=TASKS[tid]; S.drafts=S.drafts||{}; const draft=S.drafts[tid]=S.drafts[tid]||{};
  const nextSec=SECTIONS[idx(cur)+1];
  const head=T.exit?`<p class="kicker">Wrap-up &middot; graded</p><h2>Exit quiz <span class="time">3 min</span></h2><p class="lead">${T.intro}</p>`
   : `<p class="kicker">Practical ${pid.slice(1)} &middot; ${T.lang}</p><h2>Expected output <span class="time">${secMin(cur)} min</span></h2>
     <p class="lead">${note}</p><div class="exp${narrow?' narrow':''}"><img src="assets/${img}" alt="Expected output for practical ${pid.slice(1)}" loading="lazy"></div>
     <div class="callout amber">Different from yours? Go back to the step where it changed and recheck that line. Then move on: the session keeps going with <b>${esc(nextSec?nextSec.title:'the next topic')}</b>.</div>
     <h3>${T.title} <span class="pill">graded</span></h3><p class="muted">Enter values from <b>your own</b> ${T.lang} output. You can also finish these after the session.</p>`;
  el.innerHTML=head+`<div id="tbody"></div>`;
  const body=el.querySelector('#tbody');
  if(AUTH.state!=="in"){ body.innerHTML=authCard()+T.qs.map((q,i)=>qBlock(q,i,null,draft,false)).join(""); return; }
  body.innerHTML=`<p class="muted">Loading your progress…</p>`; const here=cur;
  try{ await loadAttempts(); }catch(e){ body.innerHTML=`<p class="err">Couldn't load your progress: ${esc(e.code||e.message)}</p>`; return; }
  if(cur!==here) return;
  const paint=()=>{ const sc=taskScore(tid);
    body.innerHTML=`<div class="scorebar"><span><b>${fmtM(sc.score)}</b> / ${sc.max} marks</span><span class="muted">${sc.done} of ${sc.total} finished &middot; saved to your account</span></div>
      ${T.qs.map((q,i)=>qBlock(q,i,(ATT[tid]||{})[q.id],draft,true)).join("")}
      ${sc.done===sc.total?`<div class="callout green"><b>${T.exit?'Exit quiz':'Checkpoint'} complete: ${fmtM(sc.score)} / ${sc.max}.</b> ${T.exit?'Well done. See all your marks on the next page.':'On to the next topic.'}</div>`:""}`;
    body.querySelectorAll('.tq').forEach(box=>{
      const q=T.qs.find(x=>x.id===box.dataset.q); const btn=box.querySelector('.chkq'); if(!btn) return;
      const readVal=()=>{ if(q.type==="choice"){ const r=box.querySelector('input:checked'); return r?r.value:""; } return box.querySelector('input').value.trim(); };
      box.addEventListener('input',()=>{ draft[q.id]=readVal(); save(); }); box.addEventListener('change',()=>{ draft[q.id]=readVal(); save(); });
      const go=async()=>{
        const st=box.querySelector('.qstat'); let v=readVal();
        if(!v){ st.innerHTML=`<span class="err">${q.type==="choice"?"Pick an option first.":"Type your answer first."}</span>`; return; }
        if(q.type==="num"){ v=v.replace(/,/g,""); if(!/^-?\d+(\.\d+)?$/.test(v)){ st.innerHTML=`<span class="err">Enter a number only, for example 1234 or 0.42.</span>`; return; } v=Number(v); }
        const prev=(ATT[tid]||{})[q.id];
        if(prev&&String(prev.ans)===String(v)&&!prev.correct){ st.innerHTML=`<span class="err">That's the answer you already tried. Change it first.</span>`; return; }
        btn.disabled=true; st.innerHTML=`<span class="muted">Checking…</span>`; let n=(prev?prev.n:0)+1;
        try{ let ok;
          try{ ok=await window.FB.attempt(AUTH.user.uid,tid,q.id,v,n); }
          catch(e){ if(e.code!=="permission-denied") throw e;
            await loadAttempts(true); const p2=(ATT[tid]||{})[q.id];
            if(p2&&(p2.correct||p2.n>=GR.maxAttempts)){ paint(); toast("Already finished on another device"); return; }
            const n2=(p2?p2.n:0)+1; if(n2===n) throw e; n=n2; ok=await window.FB.attempt(AUTH.user.uid,tid,q.id,v,n); }
          (ATT[tid]=ATT[tid]||{})[q.id]={uid:AUTH.user.uid,tid,qid:q.id,ans:v,n,correct:ok,at:new Date()};
          if(ok){ delete draft[q.id]; save(); }
          toast(ok?"Correct":"Incorrect"); renderToc(); paint();
          const again=body.querySelector(`.tq[data-q="${q.id}"]`); if(again) again.scrollIntoView({block:"nearest"});
        }catch(e){ btn.disabled=false; st.innerHTML=`<span class="err">${e.code==="permission-denied"?"Couldn't check this answer. Either no attempts are left or your teacher hasn't loaded the answer key yet.":"Couldn't check: "+esc(e.code||e.message)+". Check your connection and try again."}</span>`; }
      };
      btn.onclick=go; if(q.type==="num") box.querySelector('input').addEventListener('keydown',e=>{ if(e.key==="Enter") go(); });
    });
  };
  paint();
}

/* ================= MY MARKS ================= */
async function renderMyMarks(el){
  el.innerHTML=`<p class="kicker">Wrap-up</p><h2>My marks and progress</h2><div id="mm"></div>`;
  const mm=el.querySelector('#mm');
  const prog=Object.keys(P).map(k=>{ const n=P[k].steps.length, d=Object.values(S.steps[k]||{}).filter(Boolean).length; return `<tr><td>${k}</td><td>${esc(P[k].name)}</td><td><span class="counter" style="margin:0"><span class="bar"><i style="width:${d/n*100}%"></i></span></span></td><td class="n">${d} / ${n}</td></tr>`; }).join('');
  const qk=Object.keys(S.quiz||{}).reduce((a,k)=>a+Object.keys(S.quiz[k]).length,0);
  const progHTML=`<h3>Practical steps</h3><div class="tbl-wrap"><table class="mk"><thead><tr><th>Practical</th><th>Topic</th><th>Progress</th><th>Steps</th></tr></thead><tbody>${prog}</tbody></table></div><p class="muted">${qk} quick-check answers given · ${Object.keys(S.seen||{}).length} of ${SECTIONS.length} pages visited.</p>`;
  if(AUTH.state!=="in"){ mm.innerHTML=authCard()+progHTML; return; }
  mm.innerHTML=authCard()+`<p class="muted">Loading…</p>`;
  try{ await loadAttempts(true); }catch(e){ mm.innerHTML=authCard()+`<p class="err">Couldn't load marks: ${esc(e.code||e.message)}</p>`; return; }
  const secOf={t1:"p1-out",t2:"p2-out",t3:"p3-out",t4:"p4-out",t5:"p5-out",exit:"exit"};
  let tot=0,max=0;
  const rows=TASK_ORDER.map(t=>{ const T=TASKS[t]; const s=taskScore(t); tot+=s.score; max+=s.max;
    const st=s.done===s.total?`<span class="status sub">&#10003; Complete</span>`:(s.done||Object.keys(ATT[t]||{}).length)?`<span class="status not">${s.done} of ${s.total} done</span>`:`<span class="status not">Not started</span>`;
    return `<tr><td>${T.exit?"Exit":T.p}</td><td><a href="#${secOf[t]}">${esc(T.title)}</a></td><td>${st}</td><td class="n">${fmtM(s.score)} / ${s.max}</td></tr>`; }).join("");
  mm.innerHTML=authCard()+`<h3>Graded work</h3><div class="tbl-wrap"><table class="mk"><thead><tr><th>Part</th><th>Task</th><th>Status</th><th>Marks</th></tr></thead><tbody>${rows}</tbody>
   <tfoot><tr><th colspan="3">Total</th><th class="n">${fmtM(tot)} / ${max}</th></tr></tfoot></table></div>
   <p class="muted">Marks are stored in your account, so they are the same on any device. Each question allows ${GR.maxAttempts} attempts; a correct answer scores 1 on the first try and ${fmtM(GR.penalty)} less for each retry.</p>`+progHTML;
}

/* ================= NAV ================= */
const idx=id=>SECTIONS.findIndex(s=>s.id===id);
let cur=SECTIONS[0].id;
function renderToc(){
  const t=document.getElementById('toc'); let g=null, h='';
  SECTIONS.forEach(s=>{ if(s.group!==g){ if(g!==null) h+='</ol>'; g=s.group; h+=`<h4>${g}</h4><ol>`; }
    const d=s.done?s.done():false;
    h+=`<li><a href="#${s.id}" ${s.id===cur?'aria-current="page"':''}><span class="tick">${d?'&#10003;':''}</span>${s.title}${s.min?`<span class="mins">${s.min}′</span>`:''}</a></li>`; });
  t.innerHTML=h+'</ol>';
}
function go(id){ if(location.hash!=='#'+id) location.hash=id; else show(id); }
function show(id, keep){
  if(idx(id)<0) id=SECTIONS[0].id; cur=id; const i=idx(id), s=SECTIONS[i];
  if(!S.seen[id]){ S.seen[id]=true; save(); syncProgress(); }
  const m=document.getElementById('main');
  m.innerHTML=`<section class="sec" id="sec"></section><nav class="pager" aria-label="Section navigation">
    <button class="btn ghost" id="prv" ${i===0?'disabled':''}>&larr; Previous</button>
    <div class="mid">${i+1} of ${SECTIONS.length}<br><span class="hint-keys">Use &larr; &rarr; keys</span></div>
    <button class="btn" id="nxt" ${i===SECTIONS.length-1?'disabled':''}>Next &rarr;</button></nav>`;
  s.render(m.querySelector('#sec'));
  m.querySelector('#prv').onclick=()=>go(SECTIONS[i-1].id); m.querySelector('#nxt').onclick=()=>go(SECTIONS[i+1].id);
  document.getElementById('progBar').style.width=((i+1)/SECTIONS.length*100)+'%';
  document.title=s.title+' | Computer Vision Special Session';
  renderToc(); document.body.classList.remove('toc-open'); if(!keep) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b){ e.preventDefault(); go(b.dataset.go); } });
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey) return; const i=idx(cur);
  if(e.key==='ArrowRight'&&i<SECTIONS.length-1) go(SECTIONS[i+1].id);
  if(e.key==='ArrowLeft'&&i>0) go(SECTIONS[i-1].id);
});
document.getElementById('menuBtn').onclick=()=>document.body.classList.toggle('toc-open');
document.getElementById('scrim').onclick=()=>document.body.classList.remove('toc-open');
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement; const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark'; try{ localStorage.setItem(KEY+'-theme',r.dataset.theme); }catch(e){} show(cur,true);
};
try{ const th=localStorage.getItem(KEY+'-theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
show(location.hash.slice(1)||SECTIONS[0].id);

</script>
<script type="module">
/* Firebase connection. Loads only when config.js has a real config. */
const V = "10.12.2";
const cfg = window.FIREBASE_CONFIG || {};
async function boot(){
  if (window.FB_MOCK){ window.FB = window.FB_MOCK; return; }
  if (!cfg.apiKey || String(cfg.apiKey).startsWith("PASTE")){ window.FB = null; return; }
  try{
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const U = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const D = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = A.initializeApp(cfg);
    const auth = U.getAuth(app); const db = D.getFirestore(app);
    const provider = new U.GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
    try{ await U.getRedirectResult(auth); }catch(e){}
    const get1 = async (c,id)=>{ const s = await D.getDoc(D.doc(db,c,id)); return s.exists()? s.data() : null; };
    window.FB = {
      onChange: cb => U.onAuthStateChanged(auth, cb),
      signIn: async ()=>{ try{ await U.signInWithPopup(auth, provider); }
        catch(e){ if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) await U.signInWithRedirect(auth, provider); else if (e.code!=="auth/popup-closed-by-user") throw e; } },
      signOut: ()=>U.signOut(auth),
      getProfile: uid => get1("users", uid),
      register: async (uid, email, name, enr)=>{
        const b = D.writeBatch(db);
        b.set(D.doc(db,"enrollments",enr), {uid, createdAt:D.serverTimestamp()});
        b.set(D.doc(db,"users",uid), {uid, name, enrollment:enr, email, createdAt:D.serverTimestamp()});
        await b.commit();
      },
      listAttempts: async uid => (await D.getDocs(D.query(D.collection(db,"attempts"), D.where("uid","==",uid)))).docs.map(d=>d.data()),
      attempt: async (uid, tid, qid, ans, n) => {
        const ref = D.doc(db, "attempts", `${uid}__${tid}__${qid}`);
        const base = {uid, tid, qid, ans, n, at:D.serverTimestamp()};
        // The rules accept correct:true only if the answer matches the hidden key, and correct:false only if it doesn't.
        try{ await D.setDoc(ref, {...base, correct:true}); return true; }
        catch(e){ if(e.code!=="permission-denied") throw e; }
        await D.setDoc(ref, {...base, correct:false}); return false;
      },
      getProgress: uid => get1("progress", uid),
      saveProgress: (uid, steps, quiz, seen) => D.setDoc(D.doc(db,"progress",uid), {uid, steps, quiz, seen, updatedAt:D.serverTimestamp()})
    };
  }catch(e){ console.error("Firebase failed to load", e); window.FB = null; window.FB_ERROR = String(e); }
}
await boot();
window.dispatchEvent(new Event("fb-ready"));
</script>
